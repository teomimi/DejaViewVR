<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DejaView - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="login-page">

    <div class="login-container">

        <h1>DejaView</h1>

        <h2>Student Record System</h2>

        <p class="login-subtitle">
            Login to continue
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
